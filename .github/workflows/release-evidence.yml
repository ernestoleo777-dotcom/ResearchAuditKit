name: Release evidence preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"
      - name: Install build and test tooling
        run: python -m pip install -e ".[dev]"
      - name: Build candidate wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/rak-release-candidate"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/rak-release-candidate" .
      - id: capture
        name: Capture the explicit candidate asset identities
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python -I -c 'from research_audit_kit import __version__; print(__version__)')
          python -I tools/release_evidence_preflight.py capture \
            --root "$RUNNER_TEMP/rak-release-candidate" --version "$package_version" \
            > "$RUNNER_TEMP/rak-capture-summary.json"
          python - "$RUNNER_TEMP/rak-capture-summary.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result['status'] == 'PASS'
          digest = result['capture_receipt_sha256']
          version = result['package_version']
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'receipt-sha256={digest}\nversion={version}\n')
          PY
      - name: Install the candidate wheel in a fresh environment and verify evidence
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.capture.outputs.version }}
          CAPTURE_SHA256: ${{ steps.capture.outputs.receipt-sha256 }}
        run: |
          set -euo pipefail
          python -m venv --system-site-packages "$RUNNER_TEMP/rak-candidate-runtime"
          "$RUNNER_TEMP/rak-candidate-runtime/bin/python" -m pip install --ignore-installed --no-index --no-deps \
            "$RUNNER_TEMP/rak-release-candidate/research_audit_kit-$CANDIDATE_VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/rak-candidate-runtime/bin/python" -I -c \
            'import os, pathlib, sys, research_audit_kit as rak; assert pathlib.Path(rak.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); assert rak.__version__ == os.environ["CANDIDATE_VERSION"]'
          "$RUNNER_TEMP/rak-candidate-runtime/bin/python" -I tools/release_evidence_preflight.py check \
            --root "$RUNNER_TEMP/rak-release-candidate" --version "$CANDIDATE_VERSION" \
            --capture-sha256 "$CAPTURE_SHA256" > "$RUNNER_TEMP/rak-gate-summary.json"
      - name: Summarize candidate checks
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'rak-gate-summary.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Release evidence preflight\n\nCandidate build only; no release or upload performed.\n\n')
              if not report.exists() or not report.stat().st_size:
                  output.write('Preflight did not complete; see failed step logs.\n')
              else:
                  result = json.loads(report.read_text())
                  output.write(f"Mechanical gate: **{result['status']}**\n\n")
                  output.write('Claim resolution remains UNRESOLVED; hashes do not adjudicate it.\n\n')
                  output.write('| Candidate file | Observation | SHA-256 |\n| --- | --- | --- |\n')
                  for row in result.get('artifact_observations', []):
                      output.write(f"| {row['path']} | {row['status']} | {row.get('sha256', 'unresolved')} |\n")
          PY
