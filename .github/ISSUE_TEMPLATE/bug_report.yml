name: Bug report
description: Report reproducible incorrect behavior in an existing command.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for providing a small, synthetic reproduction when possible.
  - type: input
    id: version
    attributes:
      label: ResearchAuditKit version
      description: Paste the output of `rak --version` and identify the commit if installed from source.
      placeholder: rak 0.1.0rc2.dev0 at commit ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.12.4
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command with private paths and data removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest synthetic inputs that reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exit code
      description: Include stdout/stderr after checking it contains no secrets or private data.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private paths, restricted data, and identifying research content.
          required: true
