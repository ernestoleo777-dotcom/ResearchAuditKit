[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-audit-kit"
dynamic = ["version"]
description = "A lightweight toolkit for repository integrity, experiment isolation, evidence inventory, and auditable research records."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0"]
authors = [{name = "ResearchAuditKit contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3", "ruff>=0.6", "tomli>=2.0.1; python_version < '3.11'"]

[project.scripts]
rak = "research_audit_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "research_audit_kit.constants.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
