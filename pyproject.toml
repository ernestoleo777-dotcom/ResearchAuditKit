[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-audit-kit"
version = "0.1.0"
description = "A lightweight toolkit for auditing scientific repository integrity, data support, experiment isolation, and evidence-backed research decisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3", "ruff>=0.6"]

[project.scripts]
rak = "research_audit_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

