policy:
  id: portfolio_integrity_v1
  include_patterns:
    - "**/*.py"
    - "**/*.csv"
    - "**/*.md"
  exclude_patterns: []
  volatile_patterns: []
  required_files:
    - README.md
  warning_only_classes:
    - volatile_metadata
  failure_classes:
    - scientific_asset
  unexpected_scientific_file_policy: fail
