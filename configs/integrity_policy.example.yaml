policy:
  id: example_integrity_v1
  include_patterns:
    - "**/*.py"
    - "**/*.csv"
    - "**/*.md"
  exclude_patterns:
    - "build/**"
    - "out/**"
  volatile_patterns:
    - "**/.DS_Store"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.tmp"
  required_files:
    - README.md
  warning_only_classes:
    - volatile_metadata
  failure_classes:
    - scientific_asset
  unexpected_scientific_file_policy: fail

