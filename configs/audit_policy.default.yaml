policy:
  id: rak-generic-release-v1
  include_patterns:
    - "**/*"
  exclude_patterns:
    - .pytest_cache/**
    - .ruff_cache/**
    - .mypy_cache/**
    - .venv/**
    - venv/**
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyo"
  volatile_patterns:
    - .DS_Store
    - "**/.DS_Store"
  required_files: []
  warning_only_classes:
    - volatile_metadata
  failure_classes:
    - scientific_asset
  unexpected_scientific_file_policy: warn
  metadata:
    purpose: generic-public-ml-research-release-audit
    version: 1
